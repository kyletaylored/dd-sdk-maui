name: Validate Version Before Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v3.6.0)'
        required: true
        type: string
    outputs:
      version:
        description: 'Extracted version number'
        value: ${{ jobs.validate.outputs.version }}
      is_valid:
        description: 'Whether validation passed'
        value: ${{ jobs.validate.outputs.is_valid }}

jobs:
  validate:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_valid: ${{ steps.validate.outputs.is_valid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine package type
        id: package-type
        run: |
          TAG="${{ inputs.release_tag }}"
          echo "type=sdk" >> $GITHUB_OUTPUT
          echo "Package type: SDK"

      - name: Extract versions
        id: extract
        run: |
          TAG="${{ inputs.release_tag }}"
          PACKAGE_TYPE="${{ steps.package-type.outputs.type }}"

          # Extract version from git tag
          TAG_VERSION="${TAG#v}"

          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Git tag version: $TAG_VERSION"

          
          # SDK uses Directory.Build.props
          FILE_VERSION=$(grep -oPm1 "(?<=<DatadogSdkVersion>)[^<]+" Directory.Build.props)
          echo "file_version=$FILE_VERSION" >> $GITHUB_OUTPUT
          echo "Directory.Build.props version: $FILE_VERSION"
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Validate version matches
        id: validate
        run: |
          TAG_VERSION="${{ steps.extract.outputs.tag_version }}"
          FILE_VERSION="${{ steps.extract.outputs.file_version }}"
          PACKAGE_TYPE="${{ steps.package-type.outputs.type }}"

          echo "## Version Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Type | $PACKAGE_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | ${{ inputs.release_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag Version | $TAG_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Directory.Build.props Version | $FILE_VERSION |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          # Validate versions match
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "is_valid=false" >> $GITHUB_OUTPUT

            echo "### ❌ Version Mismatch Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The version in the git tag does not match the version in the project files." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Git tag version:** \`$TAG_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "**Directory.Build.props version:** \`$FILE_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required action:** Update \`<DatadogSdkVersion>\` in \`Directory.Build.props\` to \`$TAG_VERSION\` or update the git tag to \`v$FILE_VERSION\`" >> $GITHUB_STEP_SUMMARY

            exit 1
          fi

          echo "is_valid=true" >> $GITHUB_OUTPUT
          echo "### ✅ Version Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Git tag version matches project file version: \`$TAG_VERSION\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for hardcoded versions in SDK packages
        if: steps.package-type.outputs.type == 'sdk'
        run: |
          echo "## Hardcoded Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find any .csproj files with hardcoded versions
          HARDCODED_FOUND=false

          # Check for <Version>x.y.z</Version> patterns
          while IFS= read -r file; do

            # Look for hardcoded <Version> tags
            if grep -q '<Version>[0-9]' "$file"; then
              if [ "$HARDCODED_FOUND" = false ]; then
                echo "### ⚠️ Hardcoded Versions Found" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "The following files contain hardcoded versions instead of using \`\$(DatadogSdkVersion)\`:" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                HARDCODED_FOUND=true
              fi

              VERSION=$(grep -oP '<Version>\K[0-9][^<]+' "$file")
              echo "- \`$file\`: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(find . -name "*.csproj" ! -path "./obj/*" ! -path "./bin/*" ! -path "./_reference/*")

          if [ "$HARDCODED_FOUND" = false ]; then
            echo "✅ No hardcoded versions found" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Hardcoded versions should reference \`\$(DatadogSdkVersion)\` from Directory.Build.props for consistency." >> $GITHUB_STEP_SUMMARY
            echo "This is a warning only and does not block the release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check if version exists on NuGet.org
        run: |
          VERSION="${{ steps.extract.outputs.tag_version }}"
          PACKAGE_TYPE="${{ steps.package-type.outputs.type }}"

          echo "## NuGet Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PACKAGE_ID="Datadog.MAUI.Plugin"          

          # Check if version exists on NuGet.org
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID/$VERSION/$PACKAGE_ID.$VERSION.nupkg")

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "### ⚠️ Version Already Exists on NuGet.org" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Package:** \`$PACKAGE_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This version already exists on NuGet.org. The publish workflow will use \`--skip-duplicate\` to avoid errors." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**View package:** https://www.nuget.org/packages/$PACKAGE_ID/$VERSION" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Version \`$VERSION\` is new (not found on NuGet.org)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary
        if: always()
        run: |
          IS_VALID="${{ steps.validate.outputs.is_valid }}"

          if [ "$IS_VALID" == "true" ]; then
            echo "✅ All version validation checks passed"
          else
            echo "❌ Version validation failed - see summary for details"
            exit 1
          fi
